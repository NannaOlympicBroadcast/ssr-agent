# SSR Agent — Docker Compose deployment.
#
# Quick start:
#   1. Put your keys in a .env file next to this one (see .env.example):
#        GEMINI_API_KEY=...
#        TAVILY_API_KEY=...
#   2. Build & run the OpenAI-compatible API server:
#        docker compose up -d ssr
#   3. To run a messaging channel instead, configure it once into the volume,
#        then start the `channel` service (see below).
#
# All state lives in the named `ssr-data` volume (mounted at /data, with
# SSR_HOME=/data/.ssr) so credentials/tokens/sessions persist across restarts.

services:
  # ---- OpenAI-compatible HTTP API server (default) -----------------------
  ssr:
    build:
      context: .
      args:
        INSTALL_NODE: "false"
    image: ssr-agent:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SSR_HOME: /data/.ssr
      DEFAULT_MODEL: ${DEFAULT_MODEL:-gemini-3.1-flash-lite}
    volumes:
      - ssr-data:/data
    ports:
      - "8000:8000"
    command: ["serve", "--host", "0.0.0.0", "--port", "8000"]

  # ---- Messaging channel gateway (XiaoAI / Feishu / WeChat) --------------
  # Enable with:  docker compose --profile channel up -d channel
  # Configure credentials first, e.g. interactively into the same volume:
  #   docker compose run --rm channel channel config xiaomi
  channel:
    image: ssr-agent:latest
    build:
      context: .
    profiles: ["channel"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SSR_HOME: /data/.ssr
      DEFAULT_MODEL: ${DEFAULT_MODEL:-gemini-3.1-flash-lite}
      # Reach the Xiaomi Miloco service (Mi Home gateway). Point this at a
      # `miloco` service, the Docker host (host.docker.internal:1810), or a LAN
      # host running Miloco. On Windows, running the channel/gateway in Docker
      # like this is the *default* way to use Miloco (it can't run natively).
      MILOCO_BASE_URL: ${MILOCO_BASE_URL:-http://host.docker.internal:1810}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ssr-data:/data
    # Change "xiaomi" to feishu / wechat / all as needed. The channel gateway
    # also starts the Miloco activity → bus bridge automatically.
    command: ["channel", "on", "xiaomi"]

# ---- Xiaomi Miloco (Mi Home perceptive gateway) ------------------------
# Miloco is a separate project (https://github.com/XiaoMi/xiaomi-miloco) that
# runs natively on macOS/Linux only — on Windows it MUST run in Docker, which
# is why this compose file is the default deployment path there. Run Miloco on
# the Docker host (`miloco-cli dashboard`) and SSR reaches it via
# host.docker.internal, or add a `miloco` service here from its own image and
# set MILOCO_BASE_URL=http://miloco:1810.

volumes:
  ssr-data:
