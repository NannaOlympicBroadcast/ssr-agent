dataset_args:
  swe_bench_verified:
    aggregation: mean
    data_statistics: null
    dataset_id: princeton-nlp/SWE-bench_Verified
    default_subset: default
    description: '

      ## Overview


      SWE-bench Verified is a human-validated subset of 500 samples from SWE-bench,
      designed to test systems'' ability to automatically resolve real-world GitHub
      issues. Each sample represents a genuine bug fix or feature implementation from
      popular Python repositories.


      ## Task Description


      - **Task Type**: Automated Software Engineering / Bug Fixing

      - **Input**: GitHub issue description with repository context

      - **Output**: Code patch (diff format) that resolves the issue

      - **Repositories**: 12 popular Python projects (Django, Flask, Requests, etc.)


      ## Key Features


      - 500 human-validated Issue-Pull Request pairs

      - Real-world bugs from production Python repositories

      - Evaluation via unit test verification

      - Docker-based isolated execution environments

      - Tests both bug understanding and code modification skills


      ## Evaluation Notes


      - Requires `pip install swebench==4.1.0` before evaluation

      - Docker images are built/pulled automatically for each repository

      - Timeout of 1800 seconds (30 min) per instance

      - See the [usage documentation](https://evalscope.readthedocs.io/en/latest/third_party/swe_bench.html)
      for detailed setup instructions

      - Supports both local image building and remote image pulling

      '
    eval_split: test
    extra_params:
      build_docker_images: true
      dockerhub_username: swebench
      force_arch: ''
      inference_dataset_id: princeton-nlp/SWE-bench_oracle
      pull_remote_images_if_available: true
    few_shot_num: 0
    few_shot_prompt_template: null
    few_shot_random: false
    filters: null
    force_redownload: false
    max_image_bytes: null
